<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#0b1325" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background matching header badge -->
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="244" height="244" rx="58" fill="none" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.45" />

  <!-- Inner Subtle Accent Glow -->
  <circle cx="128" cy="128" r="70" fill="#2563eb" opacity="0.15" filter="url(#glow)" />

  <!-- Data Analytics Database Icon -->
  <g fill="none" stroke="url(#iconGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="18">
    <ellipse cx="128" cy="80" rx="74" ry="30" />
    <path d="M54,80 v48 c0,16.57 33.13,30 74,30 s74,-13.43 74,-30 V80" />
    <path d="M54,128 v48 c0,16.57 33.13,30 74,30 s74,-13.43 74,-30 V128" />
  </g>

  <!-- Small Analytic Data Point Highlights -->
  <circle cx="178" cy="80" r="4.5" fill="#93c5fd" />
  <circle cx="178" cy="128" r="4.5" fill="#93c5fd" />
  <circle cx="178" cy="176" r="4.5" fill="#93c5fd" />
</svg>
